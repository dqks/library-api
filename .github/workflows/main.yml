name: Go CI

# Запустить actions при коммите или создании/обновлении PR
on: 
    push:
    pull_request:

permissions: 
    contents: read

jobs:
    test:
        # Запускаем на временной виртуальной Ubuntu-машине
        runs-on: ubuntu-latest

        services:
            # Поднимаем отдельный Docker-контейнер
            postgres:
                # Контейнер использует образ postgres: 17
                image: postgres:17

                # Переменные, которые принимают Docker-образ PostgreSQL
                # Они говорят контейнеру
                env:
                    # Создать пользователя postgres
                    POSTGRES_USER: postgres
                    # С паролем postgres
                    POSTGRES_PASSWORD: postgres
                    # И создать БД library-test
                    POSTGRES_DB: library-test
                
                # Указываем порт
                ports: 
                    # порт runner : порт контейнера
                    # Благодаря этому мы можем подключаться к БД через localhost: 5432
                    - 5432:5432
                
                # Настройки Docker healthcheck
                # PostgreSQL нужно время на инициализацию
                # Поэтому используется команда ниже
                # pg_isready говорит готов ли сервер принимать соединения
                # -U postgres = пользователь postgres
                # -d library-test = бд library-test
                # Запускаем проверку готовности кажые 5 сек
                # На каждую проверку готовности даем 5 сек
                # Всего 10 попыток
                options: >-
                    --health-cmd "pg_isready -U postgres -d library-test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 15
        
        # Настройка переменной окружения для CI job
        # чтобы Go мог получить через os.Getenv() значение переменной
        env: 
            DATABASE_TEST_URL:
                postgres://postgres:postgres@localhost:5432/library-test?sslmode=disable    
                    

        steps:
            # Скачиваем текущий проект
            - name: Checkout
              uses: actions/checkout@v7

            # Скачиваем нужную версию Go ориентируясь на go.mod
            - name: Setup Go
              uses: actions/setup-go@v7
              with: 
                go-version-file: go.mod
                cache: true

              # Устанавливаем migrate для запуска миграций
            - name: Install migrate
              run: | 
                go install -tags "postgres" github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

              # Запускаем миграции
              # "$DATABASE_TEST_URL" это использование env переменной
            - name: Apply migrations
              run: |
                migrate \
                    -path ./migrations \
                    -database "$DATABASE_TEST_URL" \
                    up

            # Проверяем на потенциальные ошибки
            - name: Vet
              run: go vet ./...

            # Запускаем тесты
            - name: Test
              # Отключаем параллельный запуск тестов (параллельный относительно пакетов)
              # т.к. используется 1 БД для этого
              run: go test -p 1 ./...

            # Запускаем билд
            - name: Build
              run: go build ./...

    publish:
      name: Publish Docker Image
      # publish зависит от успешного выполнения test
      needs: test
      # при условии что мы пушим в репозиторий в ветку master
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      runs-on: ubuntu_latest

      # Права временного GITHUB_TOKEN внутри job
      permissions:
        # Может читать исходники репозитория
        contents: read
        # Может опубликовывать пакеты (в нашем случае Docker Image)
        packages: write

      steps:
        - name: Checkout
          uses: actions/checkout@7

        - name: Set Up Docker Buildx
          # Buildx - инструмент сборки Docker images
          # он поддерживает cache, multi-platform build и др.
          # пока что он только подготовит окружение
          uses: docker/setup-buildx-action@v4

        - name: Login to GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            # actor - аккаунт, инициировавший workflow
            username: ${{github.actor}}
            # GITHUB_TOKEN - временный токен, который github выдает workflow
            passwords: ${{secrets.GITHUB_TOKEN}}

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            # Docker использует файлы их корня, включая Dockerfile
            context: .
            push: true
            # github.sha - полный sha коммита 
            tags: ghcr.io/dqks/library-api:${{github.sha}}
            # Связываем package с Github репозиторием
            labels: |
              org.opencontainers.image.source=https://github.com/dqks/library-api